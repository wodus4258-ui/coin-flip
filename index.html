<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coin Flip</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root {
  --bg: #FAFAF8; --surface: #FFFFFF; --surface-hover: #F2F1ED;
  --border: #E8E6E1; --border-soft: #F0EEE9;
  --text-1: #141414; --text-2: #6B6B6B; --text-3: #9A9A9A;
  --up: #C7332D; --down: #1F4E9E;
  --accent: #141414; --accent-fg: #FFFFFF;
  --sidebar-w: 260px; --sidebar-collapsed: 56px;
  --row-h: 32px;
  --font-ui: 'Inter', 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
}
[data-theme="dark"] {
  --bg: #0E0E0D; --surface: #171716; --surface-hover: #1F1F1D;
  --border: #262624; --border-soft: #1E1E1C;
  --text-1: #EDEDED; --text-2: #8A8A8A; --text-3: #5E5E5E;
  --up: #E5484D; --down: #4A7EE0;
  --accent: #FFFFFF; --accent-fg: #0E0E0D;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--text-1);
  font-family: var(--font-ui); font-size: 13px; line-height: 1.4;
  font-feature-settings: 'tnum' 1, 'cv11' 1;
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  overflow: hidden;
  transition: background 200ms ease, color 200ms ease;
}
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input { font-family: inherit; color: inherit; }
.num { font-variant-numeric: tabular-nums; }
.up { color: var(--up); }
.down { color: var(--down); }
svg { display: block; }

#splash {
  position: fixed; inset: 0;
  display: flex; align-items: center; justify-content: center;
  background: var(--bg); z-index: 1000; cursor: pointer;
  transition: opacity 600ms cubic-bezier(0.4,0,0.2,1);
}
#splash.hidden { opacity: 0; pointer-events: none; }
.splash-inner { display: flex; flex-direction: column; align-items: center; gap: 32px; }
.splash-logo { width: 120px; height: 120px; color: var(--text-1); }
.splash-wordmark { font-size: 14px; font-weight: 700; letter-spacing: 0.14em; color: var(--text-1); }
.splash-hint {
  position: absolute; bottom: 18%;
  font-size: 11px; letter-spacing: 0.08em; color: var(--text-3);
  animation: pulse 2.4s ease-in-out infinite;
}
@keyframes pulse { 0%,100%{opacity:.4} 50%{opacity:.9} }

#app { display: flex; height: 100vh; opacity: 0; transition: opacity 400ms ease 200ms; }
#app.visible { opacity: 1; }

.theme-toggle {
  position: fixed; top: 16px; right: 24px;
  width: 32px; height: 32px; border-radius: 50%;
  border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  background: var(--bg); z-index: 50;
  transition: background 150ms;
}
.theme-toggle:hover { background: var(--surface-hover); }
.theme-toggle svg { width: 16px; height: 16px; stroke: var(--text-2); }
[data-theme="light"] .icon-moon { display: none; }
[data-theme="dark"] .icon-sun { display: none; }

.sidebar {
  width: var(--sidebar-w); flex-shrink: 0;
  background: var(--surface); border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  overflow: hidden;
  transition: width 220ms cubic-bezier(0.4,0,0.2,1);
  position: relative;
}
.sidebar.collapsed { width: var(--sidebar-collapsed); }
.sidebar-header {
  display: flex; align-items: center; gap: 8px;
  padding: 12px 12px 8px;
  position: relative; min-height: 56px; flex-shrink: 0;
}
.sidebar-toggle-btn {
  width: 32px; height: 32px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  border-radius: 6px; color: var(--text-2);
  transition: background 120ms, color 120ms;
}
.sidebar-toggle-btn:hover { background: var(--surface-hover); color: var(--text-1); }
.sidebar-toggle-btn svg { width: 18px; height: 18px; }
.sidebar-brand {
  display: flex; align-items: center; gap: 8px;
  white-space: nowrap; overflow: hidden;
  transition: opacity 120ms;
}
.sidebar.collapsed .sidebar-brand { opacity: 0; pointer-events: none; width: 0; }
.sidebar-logo { width: 22px; height: 22px; flex-shrink: 0; color: var(--text-1); }
.sidebar-wordmark { font-size: 13px; font-weight: 700; letter-spacing: 0.1em; color: var(--text-1); }
.sidebar-search {
  display: flex; align-items: center; gap: 10px;
  margin: 8px 16px 12px; padding: 0 14px;
  height: 40px;
  border: 1px solid var(--border); border-radius: 8px;
  background: var(--bg);
  transition: opacity 120ms, border-color 150ms;
  flex-shrink: 0;
}
.sidebar.collapsed .sidebar-search { opacity: 0; pointer-events: none; }
.sidebar-search:focus-within { border-color: var(--text-2); }
.sidebar-search svg { width: 15px; height: 15px; color: var(--text-3); flex-shrink: 0; }
.sidebar-search input {
  flex: 1; border: none; outline: none; background: transparent;
  font-size: 13px; color: var(--text-1);
}
.sidebar-search input::placeholder { color: var(--text-3); }
.sidebar-sections { overflow-y: auto; flex: 1; }
.sidebar-sections::-webkit-scrollbar { width: 6px; }
.sidebar-sections::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
.sidebar-section { display: flex; flex-direction: column; transition: opacity 120ms; }
.sidebar.collapsed .sidebar-section { opacity: 0; pointer-events: none; }
.sidebar-label {
  font-size: 10px; font-weight: 600; letter-spacing: 0.08em;
  color: var(--text-2); text-transform: uppercase;
  padding: 12px 16px 8px;
  display: flex; align-items: center; gap: 6px;
}
.sidebar-label svg { width: 11px; height: 11px; }
.sidebar-list { display: flex; flex-direction: column; }
.sidebar-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 16px; height: 44px;
  cursor: pointer; transition: background 100ms;
}
.sidebar-item:hover { background: var(--surface-hover); }
.sidebar-item-left { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1; }
.sidebar-item-symbol {
  font-size: 12px; font-weight: 600; color: var(--text-1);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.sidebar-item-name {
  font-size: 11px; color: var(--text-3);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.sidebar-item-right { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; flex-shrink: 0; }
.sidebar-item-price { font-size: 12px; font-weight: 500; }
.sidebar-item-change { font-size: 11px; }

.main { flex: 1; overflow-y: auto; display: flex; flex-direction: column; align-items: center; }
.main::-webkit-scrollbar { width: 10px; }
.main::-webkit-scrollbar-thumb { background: var(--border); border-radius: 5px; }
.main-inner { width: 100%; max-width: 960px; padding: 72px 32px 64px; }
.main-top {
  display: flex; flex-direction: column; align-items: center;
  gap: 16px; margin-bottom: 40px;
}
.main-logo { width: 44px; height: 44px; color: var(--text-1); }
.main-wordmark { font-size: 14px; font-weight: 700; letter-spacing: 0.16em; color: var(--text-1); }
.main-search {
  display: flex; align-items: center; gap: 10px;
  width: 100%; max-width: 480px;
  height: 40px; padding: 0 14px;
  margin: 0 auto 48px;
  border: 1px solid var(--border); border-radius: 8px;
  background: var(--surface);
  transition: border-color 150ms, box-shadow 150ms;
}
.main-search:focus-within {
  border-color: var(--text-2);
  box-shadow: 0 0 0 3px rgba(0,0,0,0.04);
}
[data-theme="dark"] .main-search:focus-within { box-shadow: 0 0 0 3px rgba(255,255,255,0.04); }
.main-search svg { width: 16px; height: 16px; color: var(--text-3); flex-shrink: 0; }
.main-search input {
  flex: 1; border: none; outline: none; background: transparent;
  font-size: 13px; color: var(--text-1);
}
.main-search input::placeholder { color: var(--text-3); }
.main-search kbd {
  font-family: var(--font-ui); font-size: 10px; color: var(--text-3);
  padding: 2px 5px; border: 1px solid var(--border); border-radius: 3px;
}

.markets { display: flex; flex-direction: column; gap: 40px; }
.market { width: 100%; }
.market-header {
  display: flex; align-items: center; justify-content: space-between;
  height: 40px; border-bottom: 1px solid var(--border);
  padding-bottom: 8px; margin-bottom: 4px;
}
.market-name { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; }
.market-name svg { width: 16px; height: 16px; border-radius: 2px; }
.market-status { font-size: 10px; color: var(--text-3); margin-left: 8px; font-weight: 400; }
.market-status.error { color: var(--down); }
.market-controls { display: flex; gap: 4px; }
.dropdown {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 4px 8px; font-size: 11px; font-weight: 500;
  color: var(--text-2); border-radius: 4px;
  transition: background 120ms, color 120ms;
}
.dropdown:hover { background: var(--surface-hover); color: var(--text-1); }
.dropdown svg { width: 12px; height: 12px; }
.market-table { width: 100%; }
.table-header {
  display: grid; grid-template-columns: 32px 1fr 100px 90px 80px 56px;
  gap: 12px; align-items: center;
  height: 28px; padding: 0 4px;
  font-size: 10px; font-weight: 500; letter-spacing: 0.05em;
  text-transform: uppercase; color: var(--text-3);
}
.table-header span:not(:nth-child(2)) { text-align: right; }
.table-row {
  display: grid; grid-template-columns: 32px 1fr 100px 90px 80px 56px;
  gap: 12px; align-items: center;
  height: var(--row-h); padding: 0 4px;
  border-bottom: 1px solid var(--border-soft);
  cursor: pointer; transition: background 100ms;
}
.table-row:hover { background: var(--surface-hover); }
.table-row .rank { font-size: 11px; color: var(--text-3); }
.table-row .name-cell { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.table-row .name-cell .sym {
  font-size: 13px; font-weight: 500;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.table-row .name-cell .full {
  font-size: 11px; color: var(--text-3);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.table-row .price { font-size: 13px; font-weight: 500; text-align: right; }
.table-row .change { font-size: 13px; font-weight: 500; text-align: right; }
.table-row .volume { font-size: 11px; color: var(--text-2); text-align: right; }
.table-row .spark { width: 56px; height: 20px; display: flex; justify-content: flex-end; }
.more-btn {
  display: block; width: 100%; padding: 12px; margin-top: 4px;
  font-size: 11px; color: var(--text-2);
  transition: color 120ms, background 120ms;
  border-radius: 4px;
}
.more-btn:hover { color: var(--text-1); background: var(--surface-hover); }

.skeleton-row {
  display: grid; grid-template-columns: 32px 1fr 100px 90px 80px 56px;
  gap: 12px; align-items: center;
  height: var(--row-h); padding: 0 4px;
  border-bottom: 1px solid var(--border-soft);
}
.skeleton-bar {
  height: 10px;
  background: var(--surface-hover);
  border-radius: 2px;
  animation: shimmer 1.4s ease-in-out infinite;
}
@keyframes shimmer {
  0%, 100% { opacity: 0.5; }
  50% { opacity: 1; }
}

.view-chart { width: 100%; display: none; }
.view-chart.active { display: block; }
.view-home.hidden { display: none; }
.chart-container { max-width: 1200px; margin: 0 auto; padding: 24px 32px 64px; }
.chart-header {
  display: flex; align-items: center; gap: 16px;
  padding-bottom: 20px; border-bottom: 1px solid var(--border);
  margin-bottom: 20px;
}
.back-btn {
  width: 32px; height: 32px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 6px; color: var(--text-2);
  transition: background 120ms, color 120ms;
  flex-shrink: 0;
}
.back-btn:hover { background: var(--surface-hover); color: var(--text-1); }
.back-btn svg { width: 18px; height: 18px; }
.chart-symbol { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1; }
.chart-symbol .sym {
  font-size: 20px; font-weight: 700; letter-spacing: -0.01em; color: var(--text-1);
  display: flex; align-items: center; gap: 8px;
}
.chart-symbol .full { font-size: 12px; color: var(--text-3); }
.chart-price { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
.chart-price .price { font-size: 22px; font-weight: 600; }
.chart-price .change { font-size: 13px; font-weight: 500; }
.chart-actions { display: flex; gap: 6px; margin-left: 8px; }
.chart-actions button {
  width: 32px; height: 32px; border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  color: var(--text-2); transition: background 120ms, color 120ms;
}
.chart-actions button:hover { background: var(--surface-hover); color: var(--text-1); }
.chart-actions svg { width: 16px; height: 16px; }

.live-badge {
  display: none;
  align-items: center; gap: 4px;
  padding: 2px 8px;
  font-size: 10px; font-weight: 700;
  letter-spacing: 0.06em;
  color: var(--up);
  border: 1px solid var(--up);
  border-radius: 3px;
  background: rgba(229,72,77,0.08);
}
.live-badge.active { display: inline-flex; }
.live-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--up);
  animation: livePulse 1.4s ease-in-out infinite;
}
@keyframes livePulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.4; transform: scale(0.85); }
}

.signal-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-left: 3px solid var(--text-3);
  border-radius: 6px;
  padding: 16px 20px;
  margin-bottom: 20px;
  display: flex; flex-direction: column; gap: 10px;
}
.signal-card.buy { border-left-color: var(--up); }
.signal-card.sell { border-left-color: var(--down); }
.signal-card.wait { border-left-color: var(--text-3); }
.signal-top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.signal-badge {
  font-size: 14px; font-weight: 700; letter-spacing: 0.02em;
  display: flex; align-items: center; gap: 6px;
}
.signal-badge .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-3); }
.signal-badge.buy .dot { background: var(--up); }
.signal-badge.sell .dot { background: var(--down); }
.signal-rule { font-size: 11px; color: var(--text-2); margin-left: auto; font-family: monospace; }
.signal-levels {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 16px; padding: 8px 0;
}
.signal-level { display: flex; flex-direction: column; gap: 4px; }
.signal-level-label { font-size: 10px; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 500; }
.signal-level-value { font-size: 18px; font-weight: 600; }
.signal-level-meta { font-size: 11px; color: var(--text-2); }
.signal-level.entry .signal-level-value { color: var(--text-1); }
.signal-level.stop .signal-level-value { color: var(--down); }
.signal-level.target .signal-level-value { color: var(--up); }
.signal-backtest {
  display: flex; gap: 16px; align-items: center;
  padding-top: 10px; border-top: 1px solid var(--border-soft);
  font-size: 11px; color: var(--text-2);
  flex-wrap: wrap;
}
.signal-backtest strong { color: var(--text-1); font-weight: 600; }
.signal-backtest .warn { color: #D97706; }
[data-theme="dark"] .signal-backtest .warn { color: #F59E0B; }
.signal-backtest .divider { width: 1px; height: 12px; background: var(--border); }

.chart-toolbar {
  display: flex; align-items: center; gap: 4px;
  padding: 6px 0;
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
}
.tb-group { display: flex; gap: 2px; flex-wrap: wrap; }
.tb-btn {
  padding: 5px 10px; font-size: 11px; font-weight: 500;
  color: var(--text-2); border-radius: 4px;
  transition: background 120ms, color 120ms;
  display: flex; align-items: center; gap: 4px;
}
.tb-btn:hover { background: var(--surface-hover); color: var(--text-1); }
.tb-btn.active { background: var(--surface-hover); color: var(--text-1); font-weight: 600; }
.tb-btn svg { width: 12px; height: 12px; }
.tb-divider { width: 1px; height: 16px; background: var(--border); margin: 0 6px; }
.tb-check {
  width: 12px; height: 12px; border-radius: 2px;
  border: 1px solid var(--text-3);
  display: flex; align-items: center; justify-content: center;
}
.tb-btn.active .tb-check { background: var(--text-1); border-color: var(--text-1); }
.tb-btn.active .tb-check svg { width: 9px; height: 9px; color: var(--bg); }

.chart-body {
  display: grid;
  grid-template-columns: 1fr 280px;
  gap: 20px;
  padding: 16px 0 20px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 20px;
}
.chart-main { min-width: 0; }
.chart-canvas {
  width: 100%; height: 420px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  position: relative; overflow: hidden;
}
.chart-canvas svg { width: 100%; height: 100%; display: block; }
.chart-loading {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; color: var(--text-3);
  background: var(--surface);
  z-index: 2;
}
.spinner {
  width: 16px; height: 16px;
  border: 2px solid var(--border);
  border-top-color: var(--text-1);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin-right: 8px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.chart-legend {
  display: flex; gap: 16px; align-items: center;
  margin-top: 10px; font-size: 10px; color: var(--text-3);
  flex-wrap: wrap;
}
.legend-item { display: flex; align-items: center; gap: 5px; }
.legend-swatch { width: 14px; height: 2px; border-radius: 1px; }
.legend-swatch.dashed { background: repeating-linear-gradient(90deg, currentColor 0 4px, transparent 4px 7px); height: 1.5px; }

.chart-aside { display: flex; flex-direction: column; gap: 16px; font-size: 11px; }
.aside-block { display: flex; flex-direction: column; gap: 6px; }
.aside-label {
  font-size: 10px; font-weight: 600; letter-spacing: 0.08em;
  color: var(--text-2); text-transform: uppercase;
}
.aside-row {
  display: flex; justify-content: space-between; align-items: baseline;
  padding: 4px 0;
}
.aside-row .k { color: var(--text-2); font-size: 11px; }
.aside-row .v { color: var(--text-1); font-weight: 500; font-size: 12px; }
.aside-row .v.warn { color: #D97706; }
[data-theme="dark"] .aside-row .v.warn { color: #F59E0B; }
.badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 6px; font-size: 10px; font-weight: 600;
  border-radius: 3px;
  text-transform: uppercase; letter-spacing: 0.04em;
}
.badge.high { background: rgba(231,76,60,0.12); color: var(--up); }
.badge.medium { background: rgba(245,158,11,0.12); color: #D97706; }
[data-theme="dark"] .badge.medium { color: #F59E0B; }
.badge.low { background: rgba(107,107,107,0.12); color: var(--text-2); }
.zone-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 6px 8px; border-radius: 4px;
  background: var(--surface);
  border: 1px solid var(--border-soft);
  font-size: 11px;
}
.zone-row .z-price { font-weight: 600; }
.zone-row .z-tag {
  font-size: 9px; font-weight: 600;
  padding: 1px 4px; border-radius: 2px;
  text-transform: uppercase; letter-spacing: 0.04em;
}
.zone-row .z-tag.high { background: rgba(231,76,60,0.15); color: var(--up); }
.zone-row .z-tag.medium { background: rgba(245,158,11,0.15); color: #D97706; }
[data-theme="dark"] .zone-row .z-tag.medium { color: #F59E0B; }
.zone-row.next { border-color: var(--up); }
.warn-list { display: flex; flex-direction: column; gap: 4px; }
.warn-item {
  display: flex; align-items: flex-start; gap: 6px;
  font-size: 11px; color: var(--text-2); line-height: 1.4;
}
.warn-item svg { width: 12px; height: 12px; flex-shrink: 0; margin-top: 1px; color: #D97706; }
[data-theme="dark"] .warn-item svg { color: #F59E0B; }

.ai-actions { display: flex; gap: 8px; margin-bottom: 16px; }
.ai-btn {
  padding: 8px 14px; font-size: 12px; font-weight: 500;
  border: 1px solid var(--border); border-radius: 6px;
  background: var(--surface); color: var(--text-1);
  display: flex; align-items: center; gap: 6px;
  transition: background 120ms, border-color 120ms;
}
.ai-btn:hover { background: var(--surface-hover); border-color: var(--text-3); }
.ai-btn svg { width: 14px; height: 14px; }
.ai-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.ai-result {
  border: 1px solid var(--border); border-radius: 6px;
  background: var(--surface);
  margin-bottom: 12px;
  overflow: hidden;
}
.ai-result-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border-soft);

/* ============================================================
   API (Vercel rewrite 프록시 경유)
   ============================================================ */
async function upbitFetch(path) {
  const url = `/api/upbit${path}`;
  const res = await fetch(url, { signal: AbortSignal.timeout(15000) });
  if (!res.ok) {
    throw new Error(`API ${res.status}: ${res.statusText}`);
  }
  return await res.json();
}

function fmtPrice(price) {
  if (price == null || isNaN(price)) return '-';
  if (price >= 100) return Math.round(price).toLocaleString('ko-KR');
  if (price >= 1) return price.toLocaleString('ko-KR', { maximumFractionDigits: 2 });
  return price.toLocaleString('ko-KR', { maximumFractionDigits: 6 });
}
function fmtVol(v) {
  if (v >= 1e12) return (v / 1e12).toFixed(1) + '조';
  if (v >= 1e8) return Math.round(v / 1e8).toLocaleString() + '억';
  if (v >= 1e4) return Math.round(v / 1e4).toLocaleString() + '만';
  return Math.round(v).toLocaleString();
}
function fmtChange(c) { return (c >= 0 ? '+' : '') + c.toFixed(2) + '%'; }
function changeClass(c) { return c >= 0 ? 'up' : 'down'; }

function sparklineSVG(positive, seed) {
  const w = 56, h = 20, n = 20;
  let val = 50;
  let rnd = seed || Math.random() * 1000;
  const rand = () => { rnd = (rnd * 9301 + 49297) % 233280; return rnd / 233280; };
  const bias = positive ? 0.58 : 0.42;
  const pts = [];
  for (let i = 0; i < n; i++) {
    val += (rand() - (1 - bias)) * 14;
    val = Math.max(12, Math.min(88, val));
    pts.push(val);
  }
  const step = w / (n - 1);
  const path = pts.map((y, i) => {
    const x = i * step;
    const sy = h - (y / 100) * h;
    return (i === 0 ? 'M' : 'L') + x.toFixed(1) + ',' + sy.toFixed(1);
  }).join(' ');
  const color = positive ? 'var(--up)' : 'var(--down)';
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" fill="none">
    <path d="${path}" stroke="${color}" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/>
  </svg>`;
}

function calcEMA(values, period) {
  if (!values.length) return [];
  const k = 2 / (period + 1);
  const out = [values[0]];
  for (let i = 1; i < values.length; i++) out.push(values[i] * k + out[i - 1] * (1 - k));
  return out;
}

function calcRSI(closes, period = 14) {
  if (closes.length < period + 1) return Array(closes.length).fill(null);
  const gains = [], losses = [];
  for (let i = 1; i < closes.length; i++) {
    const d = closes[i] - closes[i - 1];
    gains.push(Math.max(d, 0));
    losses.push(Math.max(-d, 0));
  }
  let avgG = gains.slice(0, period).reduce((a, b) => a + b, 0) / period;
  let avgL = losses.slice(0, period).reduce((a, b) => a + b, 0) / period;
  const out = Array(period).fill(null);
  out.push(avgL === 0 ? 100 : 100 - 100 / (1 + avgG / avgL));
  for (let i = period; i < gains.length; i++) {
    avgG = (avgG * (period - 1) + gains[i]) / period;
    avgL = (avgL * (period - 1) + losses[i]) / period;
    out.push(avgL === 0 ? 100 : 100 - 100 / (1 + avgG / avgL));
  }
  return out;
}

function calcATR(highs, lows, closes, period = 14) {
  const trs = [highs[0] - lows[0]];
  for (let i = 1; i < highs.length; i++) {
    trs.push(Math.max(highs[i] - lows[i], Math.abs(highs[i] - closes[i - 1]), Math.abs(lows[i] - closes[i - 1])));
  }
  const out = Array(period).fill(null);
  const init = trs.slice(1, period + 1).reduce((a, b) => a + b, 0) / period;
  out.push(init);
  for (let i = period + 1; i < trs.length; i++) {
    out.push((out[out.length - 1] * (period - 1) + trs[i]) / period);
  }
  return out;
}

function calcADX(highs, lows, closes, period = 14) {
  const n = highs.length;
  if (n < period * 2) return Array(n).fill(null);
  const tr = [], plusDM = [], minusDM = [];
  for (let i = 1; i < n; i++) {
    tr.push(Math.max(highs[i] - lows[i], Math.abs(highs[i] - closes[i - 1]), Math.abs(lows[i] - closes[i - 1])));
    const up = highs[i] - highs[i - 1];
    const dn = lows[i - 1] - lows[i];
    plusDM.push(up > dn && up > 0 ? up : 0);
    minusDM.push(dn > up && dn > 0 ? dn : 0);
  }
  const smooth = (arr) => {
    const out = [];
    let sum = arr.slice(0, period).reduce((a, b) => a + b, 0);
    out.push(sum);
    for (let i = period; i < arr.length; i++) { sum = sum - sum / period + arr[i]; out.push(sum); }
    return out;
  };
  const trS = smooth(tr), pdmS = smooth(plusDM), mdmS = smooth(minusDM);
  const plusDI = pdmS.map((v, i) => 100 * v / (trS[i] || 1));
  const minusDI = mdmS.map((v, i) => 100 * v / (trS[i] || 1));
  const dx = plusDI.map((v, i) => {
    const sum = v + minusDI[i];
    return sum === 0 ? 0 : 100 * Math.abs(v - minusDI[i]) / sum;
  });
  const adxRaw = calcEMA(dx, period);
  return Array(n - adxRaw.length).fill(null).concat(adxRaw);
}

function computeIndicators(candles) {
  const closes = candles.map(c => c.c);
  const highs = candles.map(c => c.h);
  const lows = candles.map(c => c.l);
  return {
    closes, highs, lows,
    ema20: calcEMA(closes, 20),
    ema200: calcEMA(closes, 200),
    rsi: calcRSI(closes, 14),
    atr: calcATR(highs, lows, closes, 14),
    adx: calcADX(highs, lows, closes, 14),
  };
}

function pivotPoints(candles) {
  const last = candles[candles.length - 1];
  const p = (last.h + last.l + last.c) / 3;
  return {
    pivot: p,
    r1: 2 * p - last.l, r2: p + (last.h - last.l),
    s1: 2 * p - last.h, s2: p - (last.h - last.l),
  };
}

function swingPoints(candles, lookback = 5) {
  const out = [];
  for (let i = lookback; i < candles.length - lookback; i++) {
    const h = candles[i].h, l = candles[i].l;
    let isHigh = true, isLow = true;
    for (let j = i - lookback; j <= i + lookback; j++) {
      if (j === i) continue;
      if (candles[j].h > h) isHigh = false;
      if (candles[j].l < l) isLow = false;
    }
    if (isHigh) out.push({ price: h, type: 'resistance', idx: i });
    if (isLow) out.push({ price: l, type: 'support', idx: i });
  }
  return out;
}

function mergeLevels(candidates, tolerancePct = 0.005) {
  if (!candidates.length) return [];
  const sorted = [...candidates].sort((a, b) => a.price - b.price);
  const clusters = [];
  for (const c of sorted) {
    let placed = false;
    for (const cl of clusters) {
      const ref = cl[0].price;
      if (ref > 0 && Math.abs(c.price - ref) / ref <= tolerancePct) { cl.push(c); placed = true; break; }
    }
    if (!placed) clusters.push([c]);
  }
  return clusters.map(cl => {
    const prices = cl.map(c => c.price);
    const sources = [...new Set(cl.map(c => c.source))];
    const score = cl.length + (sources.length >= 2 ? 0.5 : 0);
    return {
      price: prices.reduce((a, b) => a + b, 0) / prices.length,
      strength: score >= 3 ? 'HIGH' : score >= 2 ? 'MEDIUM' : 'LOW',
      score, sources, touchCount: cl.length,
    };
  });
}

function computeZones(candles, currentPrice) {
  const candidates = [];
  const pp = pivotPoints(candles);
  ['pivot', 'r1', 'r2', 's1', 's2'].forEach(k => candidates.push({ price: pp[k], source: `pivot_${k.toUpperCase()}` }));
  const swings = swingPoints(candles, 5);
  swings.slice(-15).forEach(s => candidates.push({ price: s.price, source: 'swing' }));
  const merged = mergeLevels(candidates);
  const above = merged.filter(z => z.price > currentPrice).sort((a, b) => a.price - b.price);
  const below = merged.filter(z => z.price < currentPrice).sort((a, b) => b.price - a.price);
  const nextTarget = above[0], nextSupport = below[0];
  merged.forEach(z => {
    const dist = Math.abs(z.price - currentPrice) / currentPrice;
    if (dist <= 0.002) z.state = 'INSIDE';
    else if (dist <= 0.005) z.state = 'NEAR';
    else if ((nextTarget && z.price === nextTarget.price) || (nextSupport && z.price === nextSupport.price)) z.state = 'NEXT_TARGET';
    else z.state = 'AHEAD';
  });
  return merged;
}

function classifyRegime(candles, ind) {
  if (candles.length < 60) return { state: 'unknown', adx: 0, atrPercentile: 0 };
  const lastATR = ind.atr[ind.atr.length - 1];
  const validATR = ind.atr.filter(v => v != null);
  const atrPct = validATR.length > 0 ? validATR.filter(v => v < lastATR).length / validATR.length : 0;
  const adx = ind.adx[ind.adx.length - 1] || 0;
  let state;
  if (atrPct > 0.8) state = 'high_vol';
  else if (adx > 25) state = 'trending';
  else if (adx < 20) state = 'ranging';
  else state = 'transition';
  return { state, adx: Math.round(adx * 100) / 100, atrPercentile: Math.round(atrPct * 100) / 100 };
}

function generateSignal(candles, ind) {
  if (candles.length < 50) return { action: 'wait', rule_id: 'S_H1_insufficient', rule_name: '데이터 부족' };
  const last = candles[candles.length - 1];
  const price = last.c;
  const rsi = ind.rsi[ind.rsi.length - 1];
  const atr = ind.atr[ind.atr.length - 1];
  const vol = last.v;
  const avgVol = candles.slice(-21, -1).reduce((a, b) => a + b.v, 0) / 20;
  const trend = ind.ema20[ind.ema20.length - 1] > ind.ema200[ind.ema200.length - 1] ? 'up' : 'down';
  const pp = pivotPoints(candles);
  const r1 = pp.r1, s1 = pp.s1;

  if (Math.abs(price - s1) / price <= 0.005 && rsi < 40 && trend !== 'down') {
    return _buildSignal('S_R1_pivot_bounce', 'S1 지지 반등', s1, s1 - atr * 1.5, pp.pivot, price, atr, 'buy');
  }
  if (price > r1 && vol > avgVol * 1.2) {
    return _buildSignal('S_R2_breakout', '저항 돌파', r1, r1 - atr * 1.0, pp.r2, price, atr, 'buy');
  }
  if (Math.abs(price - r1) / price <= 0.005 && rsi > 70) {
    return _buildSignal('S_R3_resistance_reject', '저항 거부', r1, r1 + atr * 1.5, pp.pivot, price, atr, 'sell');
  }
  if (price < s1 && vol > avgVol * 1.2) {
    return _buildSignal('S_R4_support_break', '지지 이탈', s1, s1 + atr * 1.0, pp.s2, price, atr, 'sell');
  }
  const distR1 = ((r1 - price) / price * 100).toFixed(2);
  return { action: 'wait', rule_id: 'S_H1_no_signal', rule_name: '신호 없음', reason: `조건 미충족. R1까지 ${distR1}%`, price, r1, s1 };
}

function _buildSignal(ruleId, ruleName, entry, stop, target, price, atr, action) {
  const risk = Math.abs(entry - stop), reward = Math.abs(target - entry);
  const rr = risk > 0 ? reward / risk : 0;
  return {
    action, rule_id: ruleId, rule_name: ruleName,
    entry, stop_loss: stop, take_profit: target,
    risk_reward: Math.round(rr * 100) / 100,
    current_price: price, atr,
  };
}

function backtestSignal(candles, ind, targetRuleId) {
  if (candles.length < 60) return null;
  const trades = [];
  const start = Math.max(20, candles.length - 200);
  for (let i = start; i < candles.length - 1; i++) {
    const slice = candles.slice(0, i + 1);
    const sliceInd = {
      rsi: ind.rsi.slice(0, i + 1),
      atr: ind.atr.slice(0, i + 1),
      ema20: ind.ema20.slice(0, i + 1),
      ema200: ind.ema200.slice(0, i + 1),
    };
    const sig = generateSignal(slice, sliceInd);
    if (sig.rule_id !== targetRuleId) continue;
    let outcome = null;
    for (let j = i + 1; j < candles.length; j++) {
      const c = candles[j];
      if (sig.action === 'buy') {
        if (c.l <= sig.stop_loss) { outcome = 'loss'; break; }
        if (c.h >= sig.take_profit) { outcome = 'win'; break; }
      } else {
        if (c.h >= sig.stop_loss) { outcome = 'loss'; break; }
        if (c.l <= sig.take_profit) { outcome = 'win'; break; }
      }
    }
    if (outcome) trades.push({ outcome, rr: sig.risk_reward });
  }
  const wins = trades.filter(t => t.outcome === 'win').length;
  const losses = trades.filter(t => t.outcome === 'loss').length;
  const total = wins + losses;
  if (total === 0) return { winRate: 0, total: 0, wins: 0, losses: 0 };
  const winRate = wins / total;
  const avgRR = trades.length ? trades.reduce((a, b) => a + b.rr, 0) / trades.length : 0;
  const expectancy = winRate * avgRR - (1 - winRate);
  const expected = total * 0.5;
  const sd = Math.sqrt(total * 0.25);
  const z = sd > 0 ? Math.abs(wins - expected) / sd : 0;
  const pValue = 2 * (1 - normalCDF(z));
  return {
    winRate: Math.round(winRate * 1000) / 10,
    total, wins, losses,
    avgRR: Math.round(avgRR * 100) / 100,
    expectancy: Math.round(expectancy * 100) / 100,
    pValue: Math.round(pValue * 100) / 100,
  };
}

function normalCDF(z) {
  const t = 1 / (1 + 0.2316419 * Math.abs(z));
  const d = 0.3989423 * Math.exp(-z * z / 2);
  const p = d * t * (0.3193815 + t * (-0.3565638 + t * (1.781478 + t * (-1.821256 + t * 1.330274))));
  return z >= 0 ? 1 - p : p;
}

async function loadCandles(symbol, tf, count) {
  const market = `KRW-${symbol}`;
  let endpoint;
  if (tf === '1d') endpoint = `/v1/candles/days?market=${market}&count=${Math.min(count, 200)}`;
  else if (tf.endsWith('m')) {
    const unit = tf.replace('m', '');
    endpoint = `/v1/candles/minutes/${unit}?market=${market}&count=${Math.min(count, 200)}`;
  } else if (tf.endsWith('h')) {
    const unit = parseInt(tf.replace('h', '')) * 60;
    endpoint = `/v1/candles/minutes/${unit}?market=${market}&count=${Math.min(count, 200)}`;
  }
  const data = await upbitFetch(endpoint);
  return data.reverse().map(d => ({
    t: d.timestamp, o: d.opening_price, h: d.high_price, l: d.low_price, c: d.trade_price, v: d.candle_acc_trade_volume,
  }));
}

function renderRangeButtons() {
  const group = document.getElementById('rangeGroup');
  const opts = RANGE_OPTIONS[state.chart.tf] || [];
  if (!opts.some(o => o.key === state.chart.range)) state.chart.range = opts[0]?.key;
  group.innerHTML = opts.map(o => `
    <button class="tb-btn ${state.chart.range === o.key ? 'active' : ''}" data-range="${o.key}" data-count="${o.count}">${o.label}</button>
  `).join('');
  group.querySelectorAll('[data-range]').forEach(btn => {
    btn.addEventListener('click', async () => {
      group.querySelectorAll('[data-range]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      state.chart.range = btn.dataset.range;
      await loadChartData();
    });
  });
}

function updateLiveBadge() {
  const badge = document.getElementById('liveBadge');
  if (MINUTE_TFS.includes(state.chart.tf)) badge.classList.add('active');
  else badge.classList.remove('active');
}

function getRangeCount() {
  const opts = RANGE_OPTIONS[state.chart.tf] || [];
  const current = opts.find(o => o.key === state.chart.range);
  return current ? current.count : 200;
}

async function loadChartData() {
  const c = state.chart;
  if (!c.sym) return;
  c.loading = true;
  c.error = null;
  document.getElementById('chartCanvas').innerHTML = `<div class="chart-loading"><div class="spinner"></div>데이터 수신 중...</div>`;
  try {
    const count = getRangeCount();
    const candles = await loadCandles(c.sym, c.tf, count);
    c.candles = candles;
    c.indicators = computeIndicators(candles);
    c.signal = generateSignal(candles, c.indicators);
    if (c.signal.rule_id && c.signal.rule_id.startsWith('S_R')) {
      c.backtest = backtestSignal(candles, c.indicators, c.signal.rule_id);
    } else c.backtest = null;
    c.loading = false;
    renderChart();
    renderSignalCard();
    renderAside();
  } catch (e) {
    c.loading = false;
    c.error = e.message;
    document.getElementById('chartCanvas').innerHTML = `
      <div class="chart-loading" style="flex-direction:column;gap:8px;color:var(--text-2)">
        <div>⚠ 데이터 수신 실패</div>
        <div style="font-size:10px;color:var(--text-3)">${e.message}</div>
        <button onclick="loadChartData()" style="margin-top:8px;padding:6px 14px;border:1px solid var(--border);border-radius:4px;font-size:11px;color:var(--text-1)">재시도</button>
      </div>
    `;
  }
}

function renderAside() {
  const ind = state.chart.indicators;
  const candles = state.chart.candles;
  if (!ind || !candles.length) return;
  const last = candles[candles.length - 1];
  const currentPrice = last.c;
  const regime = classifyRegime(candles, ind);
  document.getElementById('regimeState').textContent = regime.state;
  document.getElementById('regimeAdx').textContent = regime.adx;
  document.getElementById('regimeAtr').textContent = (regime.atrPercentile * 100).toFixed(0) + '%';
  const zones = computeZones(candles, currentPrice);
  const top = zones.filter(z => z.strength !== 'LOW').sort((a, b) => Math.abs(a.price - currentPrice) - Math.abs(b.price - currentPrice)).slice(0, 3);
  document.getElementById('zonesList').innerHTML = top.map(z => `
    <div class="zone-row ${z.state === 'NEXT_TARGET' ? 'next' : ''}">
      <span class="z-price num">${fmtPrice(z.price)}</span>
      <span class="z-tag ${z.strength.toLowerCase()}">${z.strength}</span>
    </div>
  `).join('') || '<div style="font-size:11px;color:var(--text-3)">존 없음</div>';
  const rsi = ind.rsi[ind.rsi.length - 1];
  document.getElementById('rsi1h').textContent = state.chart.tf === '1h' ? rsi?.toFixed(1) : '-';
  document.getElementById('rsi4h').textContent = state.chart.tf === '4h' ? rsi?.toFixed(1) : '-';
  document.getElementById('rsi1d').textContent = state.chart.tf === '1d' ? rsi?.toFixed(1) : '-';
  const warnings = [];
  if (rsi != null) {
    if (rsi > 70) warnings.push(`RSI ${rsi.toFixed(1)} 단기 과열`);
    else if (rsi < 30) warnings.push(`RSI ${rsi.toFixed(1)} 단기 침체`);
  }
  if (regime.state === 'high_vol') warnings.push('고변동성 구간');
  document.getElementById('warningsList').innerHTML = warnings.length
    ? warnings.map(w => `
        <div class="warn-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
          ${w}
        </div>`).join('')
    : '<div style="font-size:11px;color:var(--text-3)">경고 없음</div>';
}

function renderChart() {
  const canvas = document.getElementById('chartCanvas');
  const c = state.chart;
  if (!c.sym || !c.candles.length) return;
  const width = canvas.clientWidth || 800;
  const height = canvas.clientHeight || 420;
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  const candles = c.candles;
  const sig = c.signal;
  const currentPrice = candles[candles.length - 1].c;
  const levels = [];
  if (sig && sig.action !== 'wait' && c.layers.levels) {
    levels.push({ price: sig.take_profit, color: isDark ? '#E5484D' : '#C7332D', label: '목표', dash: '0' });
    levels.push({ price: sig.entry, color: isDark ? '#EDEDED' : '#141414', label: '진입', dash: '4 3' });
    levels.push({ price: sig.stop_loss, color: isDark ? '#4A7EE0' : '#1F4E9E', label: '손절', dash: '0' });
  }
  levels.push({ price: currentPrice, color: isDark ? '#5E5E5E' : '#9A9A9A', label: '현재', dash: '2 3' });
  const highs = candles.map(x => x.h);
  const lows = candles.map(x => x.l);
  const max = Math.max(...highs, ...levels.map(l => l.price)) * 1.005;
  const min = Math.min(...lows, ...levels.map(l => l.price)) * 0.995;
  const rng = max - min || 1;
  const padTop = 16, padBottom = 16, padLeft = 8, padRight = 68;
  const chartW = width - padLeft - padRight;
  const chartH = height - padTop - padBottom;
  const yOf = (p) => padTop + chartH - ((p - min) / rng) * chartH;
  const gap = chartW / candles.length;
  const candleW = Math.max(1.5, gap * 0.65);
  const up = isDark ? '#E5484D' : '#C7332D';
  const down = isDark ? '#4A7EE0' : '#1F4E9E';
  const grid = isDark ? '#1E1E1C' : '#F0EEE9';
  const textMuted = isDark ? '#5E5E5E' : '#9A9A9A';
  let svg = `<svg viewBox="0 0 ${width} ${height}" xmlns="http://www.w3.org/2000/svg">`;
  const gridSteps = 5;
  for (let i = 0; i <= gridSteps; i++) {
    const yy = padTop + (chartH / gridSteps) * i;
    svg += `<line x1="${padLeft}" y1="${yy}" x2="${padLeft + chartW}" y2="${yy}" stroke="${grid}" stroke-width="1"/>`;
  }
  if (c.layers.zones && sig && sig.action !== 'wait') {
    const r1Top = yOf(sig.take_profit * 1.008);
    const r1Bot = yOf(sig.take_profit * 0.996);
    svg += `<rect x="${padLeft}" y="${r1Top}" width="${chartW}" height="${r1Bot - r1Top}" fill="${up}" opacity="0.05"/>`;
    const s1Top = yOf(sig.stop_loss * 1.004);
    const s1Bot = yOf(sig.stop_loss * 0.992);
    svg += `<rect x="${padLeft}" y="${s1Top}" width="${chartW}" height="${s1Bot - s1Top}" fill="${down}" opacity="0.05"/>`;
  }
  candles.forEach((cd, i) => {
    const x = padLeft + i * gap + gap / 2;
    const isUp = cd.c >= cd.o;
    const color = isUp ? up : down;
    const bodyTop = yOf(Math.max(cd.o, cd.c));
    const bodyBot = yOf(Math.min(cd.o, cd.c));
    const bodyH = Math.max(1, bodyBot - bodyTop);
    svg += `<line x1="${x}" y1="${yOf(cd.h)}" x2="${x}" y2="${yOf(cd.l)}" stroke="${color}" stroke-width="1"/>`;
    svg += `<rect x="${(x - candleW/2).toFixed(2)}" y="${bodyTop.toFixed(2)}" width="${candleW.toFixed(2)}" height="${bodyH.toFixed(2)}" fill="${color}"/>`;
  });
  levels.forEach(l => {
    const yy = yOf(l.price);
    svg += `<line x1="${padLeft}" y1="${yy}" x2="${padLeft + chartW}" y2="${yy}" stroke="${l.color}" stroke-width="1" stroke-dasharray="${l.dash}"/>`;
    svg += `<text x="${padLeft + chartW + 6}" y="${yy + 3.5}" fill="${l.color}" font-size="10" font-family="Inter, Pretendard" font-weight="500">${l.label}</text>`;
    svg += `<text x="${padLeft + chartW + 6}" y="${yy + 15}" fill="${textMuted}" font-size="9" font-family="Inter, Pretendard">${fmtPrice(l.price)}</text>`;
  });
  svg += `</svg>`;
  canvas.innerHTML = svg;
}

let activeMenu = null;
function closeMenu() { if (activeMenu) { activeMenu.remove(); activeMenu = null; } }
function openMenu(anchor, items) {
  closeMenu();
  const rect = anchor.getBoundingClientRect();
  const menu = document.createElement('div');
  menu.className = 'dd-menu';
  menu.style.top = (rect.bottom + 4) + 'px';
  menu.style.left = rect.left + 'px';
  menu.style.minWidth = Math.max(rect.width, 120) + 'px';
  items.forEach(it => {
    const row = document.createElement('div');
    row.className = 'dd-item' + (it.active ? ' active' : '');
    row.textContent = it.label;
    row.addEventListener('click', () => { closeMenu(); it.onSelect(); });
    menu.appendChild(row);
  });
  document.body.appendChild(menu);
  activeMenu = menu;
}
document.addEventListener('click', closeMenu);

const sidebar = document.getElementById('sidebar');
const toggleIcon = document.getElementById('toggleIcon');
document.getElementById('sidebarToggle').addEventListener('click', (e) => {
  e.stopPropagation();
  sidebar.classList.toggle('collapsed');
  if (sidebar.classList.contains('collapsed')) {
    toggleIcon.innerHTML = '<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/><path d="m14 9 3 3-3 3"/>';
  } else {
    toggleIcon.innerHTML = '<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/><path d="m16 15-3-3 3-3"/>';
  }
});

const savedTheme = localStorage.getItem('coin-flip-theme') || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
document.documentElement.setAttribute('data-theme', savedTheme);
document.getElementById('themeToggle').addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('coin-flip-theme', next);
  if (state.chart.sym && state.chart.candles.length) renderChart();
});

const splash = document.getElementById('splash');
const app = document.getElementById('app');
let entered = false;
function enterApp() {
  if (entered) return;
  entered = true;
  splash.classList.add('hidden');
  setTimeout(() => { app.classList.add('visible'); }, 200);
  setTimeout(() => { splash.style.display = 'none'; }, 800);
  loadMarketList();
}
splash.addEventListener('click', enterApp);
document.addEventListener('keydown', (e) => {
  if (!entered && (e.code === 'Space' || e.key === ' ' || e.key === 'Enter')) {
    e.preventDefault();
    enterApp();
  }
});

document.addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
    e.preventDefault();
    document.getElementById('mainSearchInput').focus();
  }
});

document.getElementById('backBtn').addEventListener('click', closeChart);

document.querySelectorAll('#tfGroup [data-tf]').forEach(btn => {
  btn.addEventListener('click', async () => {
    document.querySelectorAll('#tfGroup [data-tf]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state.chart.tf = btn.dataset.tf;
    renderRangeButtons();
    updateLiveBadge();
    await loadChartData();
  });
});

document.querySelectorAll('.chart-toolbar [data-layer]').forEach(btn => {
  btn.addEventListener('click', () => {
    const key = btn.dataset.layer;
    state.chart.layers[key] = !state.chart.layers[key];
    btn.classList.toggle('active', state.chart.layers[key]);
    if (state.chart.candles.length) renderChart();
  });
});

window.addEventListener('resize', () => {
  if (state.chart.sym && state.chart.candles.length) renderChart();
});

document.getElementById('btnAiExplain').addEventListener('click', () => {
  const results = document.getElementById('aiResults');
  const el = document.createElement('div');
  el.className = 'ai-result fade-in';
  el.innerHTML = `
    <div class="ai-result-header">
      <span>AI 해설</span>
      <svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
    </div>
    <div class="ai-result-body">
      <div class="notice">
        AI 해설 기능은 다음 단계에서 OpenRouter(DeepSeek)와 연결됩니다.<br><br>
        현재 화면의 <strong>신호 카드</strong>와 <strong>백테스트</strong>는 이미 실제 업비트 데이터로 계산된 결과입니다.
      </div>
    </div>
  `;
  el.querySelector('.ai-result-header').addEventListener('click', () => el.classList.toggle('collapsed'));
  results.prepend(el);
});

renderMarkets();
</script>
